name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Swift format
        run: |
          set -euo pipefail
          if command -v swift-format >/dev/null 2>&1; then
            FORMATTER=(swift-format)
          else
            FORMATTER=(xcrun swift-format)
          fi
          "${FORMATTER[@]}" lint --recursive --strict Sources Tests

      - name: Unit tests
        run: swift test

      - name: Address sanitizer
        run: swift test --sanitize=address --filter PublicEarFiCoreTests

      - name: Thread sanitizer
        run: swift test --sanitize=thread --filter PublicEarFiCoreTests

      - name: Restore bundled helpers
        uses: actions/cache/restore@v4
        with:
          path: build/helpers
          key: helpers-v1-${{ hashFiles('scripts/versions.env', 'scripts/ffmpeg-configure-flags.txt', 'scripts/build-helpers.sh') }}

      - name: Build MediaMTX and LGPL ffmpeg
        run: ./scripts/build-helpers.sh

      - name: Save bundled helpers
        uses: actions/cache/save@v4
        with:
          path: build/helpers
          key: helpers-v1-${{ hashFiles('scripts/versions.env', 'scripts/ffmpeg-configure-flags.txt', 'scripts/build-helpers.sh') }}

      - name: Check MediaMTX accepts the generated config
        run: MEDIAMTX_BIN="$PWD/build/helpers/mediamtx" swift test --filter MediaMTXConfigTests/testRealMediaMTXAcceptsGeneratedConfig

      - name: Build and ad-hoc sign the app
        run: ./scripts/build-app.sh

      - name: Check credits, architectures, and the signature
        run: |
          set -euo pipefail
          ./scripts/check-credits.sh "dist/Public EarFi.app"
          codesign --verify --deep --strict --verbose=2 "dist/Public EarFi.app"
          lipo -info "dist/Public EarFi.app/Contents/MacOS/PublicEarFi" | grep arm64
          lipo -info "dist/Public EarFi.app/Contents/MacOS/PublicEarFi" | grep x86_64
          lipo -info "dist/Public EarFi.app/Contents/Helpers/ffmpeg" | grep arm64
          lipo -info "dist/Public EarFi.app/Contents/Helpers/ffmpeg" | grep x86_64
          lipo -info "dist/Public EarFi.app/Contents/Helpers/mediamtx" | grep arm64
          lipo -info "dist/Public EarFi.app/Contents/Helpers/mediamtx" | grep x86_64
          "dist/Public EarFi.app/Contents/Helpers/ffmpeg" -version | grep -- '--enable-libopus'
          "dist/Public EarFi.app/Contents/Helpers/ffmpeg" -hide_banner -buildconf | grep -q -- '--disable-gpl'

      - name: Smoke test pcm_f32le publish to MediaMTX
        run: ./scripts/smoke-rtsp.sh "dist/Public EarFi.app"

      - name: Package a DMG
        run: ./scripts/package-dmg.sh

      - name: Zip the app
        run: ditto -c -k --keepParent "dist/Public EarFi.app" "dist/Public-EarFi-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Public-EarFi-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/Public-EarFi-app.zip
            dist/SHA256SUMS
